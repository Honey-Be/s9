[project]
name = "s9"
version = "0.6.4"
description = "S9/RS9: Multidimensional SSM based on S4ND + S7 Fusion"
authors = [
    {name = "윤병익",email = "yeun0908@gmail.com"}
]
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.12, <3.15"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [
    {include = "s9", from = "src"},
    {include = "h9", from = "src", to = "s9"}
]

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cpu"
priority = "explicit"
url = "https://download.pytorch.org/whl/cpu"

[tool.poetry.dependencies]  
torch = [
    {version = "2.10.0+cpu", source = "pytorch-cpu", markers = "extra=='cpu' and extra!='cu126' and extra!='cu128' and extra!='cu130'"},
    {version = "2.10.0+cu126", source = "pytorch-cu126", markers = "extra!='cpu' and extra=='cu126' and extra!='cu128' and extra!='cu130'"},
    {version = "2.10.0+cu128", source = "pytorch-cu128", markers = "extra!='cpu' and extra!='cu126' and extra=='cu128' and extra!='cu130'"},
    {version = "2.10.0+cu130", source = "pytorch-cu130", markers = "extra!='cpu' and extra!='cu126' and extra!='cu128' and extra=='cu130'"}
]
numpy = "^2.4.3"
ypsilon-torch = [
    {git = "https://github.com/newsniper-org/ypsilon-torch", rev = "v1.1.0", extras = ["cpu"], markers = "extra=='cpu' and extra!='cu126' and extra!='cu128' and extra!='cu130'"},
    {git = "https://github.com/newsniper-org/ypsilon-torch", rev = "v1.1.0", extras = ["cu126"], markers = "extra!='cpu' and extra=='cu126' and extra!='cu128' and extra!='cu130'"},
    {git = "https://github.com/newsniper-org/ypsilon-torch", rev = "v1.1.0", extras = ["cu128"], markers = "extra!='cpu' and extra!='cu126' and extra=='cu128' and extra!='cu130'"},
    {git = "https://github.com/newsniper-org/ypsilon-torch", rev = "v1.1.0", extras = ["cu130"], markers = "extra!='cpu' and extra!='cu126' and extra!='cu128' and extra=='cu130'"}
]

[tool.poetry.extras]
cpu = ["torch", "ypsilon-torch"]
cu126 = ["torch", "ypsilon-torch"]
cu128 = ["torch", "ypsilon-torch"]
cu130 = ["torch", "ypsilon-torch"]
h9 = ["h9"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
