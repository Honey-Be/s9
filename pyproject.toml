[project]
name = "s9"
version = "0.2.1"
description = "S9/RS9: Multidimensional SSM based on S4ND + S7 Fusion"
authors = [
    {name = "윤병익",email = "yeun0908@gmail.com"}
]
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.12, <3.14"

[project.optional-dependencies]
cpu = [
    "torch (>=2.10.0+cpu,<3.0.0+cpu) ; extra == 'cpu' and extra != 'cu126' and extra != 'cu128' and extra != 'cu130'"
]
cu126 = [
    "torch (>=2.10.0+cu126,<3.0.0+cu126) ; extra != 'cpu' and extra == 'cu126' and extra != 'cu128' and extra != 'cu130'"
]
cu128 = [
    "torch (>=2.10.0+cu128,<3.0.0+cu128) ; extra != 'cpu' and extra != 'cu126' and extra == 'cu128' and extra != 'cu130'"
]
cu130 = [
    "torch (>=2.10.0+cu130,<3.0.0+cu130) ; extra != 'cpu' and extra != 'cu126' and extra != 'cu128' and extra == 'cu130'"
]

[tool.poetry]
packages = [{include = "s9", from = "src"}]

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cpu"
priority = "explicit"
url = "https://download.pytorch.org/whl/cpu"

[tool.poetry.dependencies]
torch = [
    {source = "pytorch-cpu", markers = "extra=='cpu' and extra!='cu126' and extra!='cu128' and extra!='cu130'"},
    {source = "pytorch-cu126", markers = "extra!='cpu' and extra=='cu126' and extra!='cu128' and extra!='cu130'"},
    {source = "pytorch-cu128", markers = "extra!='cpu' and extra!='cu126' and extra=='cu128' and extra!='cu130'"},
    {source = "pytorch-cu130", markers = "extra!='cpu' and extra!='cu126' and extra!='cu128' and extra=='cu130'"}
]

[tool.poetry.extras]
cpu = []
cu126 = []
cu128 = []
cu130 = []


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
